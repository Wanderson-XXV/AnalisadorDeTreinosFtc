<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker Lab Review - decode_v1</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181b1f;
      --muted: #9aa4ad;
      --line: #30363d;
      --accent: #39d98a;
      --warn: #ffca3a;
      --bad: #ff5d5d;
      --text: #f3f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #0c0e10;
    }
    h1 { margin: 0; font-size: 22px; }
    .subtle { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .metrics { display: flex; gap: 18px; flex-wrap: wrap; }
    .metric b { display: block; font-size: 20px; }
    .metric span { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(360px, .9fr);
      gap: 14px;
      padding: 14px;
      min-height: calc(100vh - 88px);
    }
    video, .arena {
      width: 100%;
      background: #000;
      border: 1px solid var(--line);
    }
    .arena {
      position: relative;
      min-height: 440px;
      overflow: hidden;
    }
    .arena img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .events {
      margin-top: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      max-height: 260px;
      overflow: auto;
    }
    .event-row {
      width: 100%;
      display: grid;
      grid-template-columns: 140px 80px 1fr;
      gap: 10px;
      padding: 9px 11px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      cursor: pointer;
    }
    .event-row:hover { background: #20252a; }
    .event-name { color: var(--accent); font-weight: 700; }
    .event-time { color: var(--muted); }
    @media (max-width: 960px) {
      header { align-items: start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    const data = JSON.parse(document.getElementById('tracker-data').textContent);
    const metrics = data.metrics || {};
    document.getElementById('okPct').textContent = `${metrics.tracking_ok_percent ?? 0}%`;
    document.getElementById('corrections').textContent = metrics.corrections_per_minute ?? 0;
    document.getElementById('reselects').textContent = metrics.roi_reselections ?? 0;
    document.getElementById('longest').textContent = `${metrics.longest_segment_without_reselect_seconds ?? 0}s`;

    const video = document.getElementById('video');
    const events = document.getElementById('events');
    events.innerHTML = data.events.map((event) => `
      <button class="event-row" data-time="${event.time_seconds || 0}">
        <span class="event-name">${event.event}</span>
        <span class="event-time">${event.time_seconds || 0}s</span>
        <span>${event.detail || ''}</span>
      </button>
    `).join('');
    events.querySelectorAll('button').forEach((button) => {
      button.addEventListener('click', () => {
        video.currentTime = Number(button.dataset.time || 0);
        video.pause();
        drawTrajectory(Number(button.dataset.time || -1));
      });
    });

    const canvas = document.getElementById('trajectory');
    const arenaImg = document.getElementById('arenaImg');
    function resizeCanvas() {
      const rect = arenaImg.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width));
      canvas.height = Math.max(1, Math.round(rect.height));
      drawTrajectory(video.currentTime);
    }
    function drawTrajectory(highlightTime) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const width = Number(metrics.field_width || 1000);
      const height = Number(metrics.field_height || 1000);
      const points = data.positions
        .filter((p) => p.tracking_ok === 'true' && p.field_x && p.field_y)
        .map((p) => ({
          x: Number(p.field_x) / width * canvas.width,
          y: Number(p.field_y) / height * canvas.height,
          t: Number(p.time_seconds || 0),
        }));
      if (points.length < 2) return;
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#39d98a';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      points.slice(1).forEach((p) => ctx.lineTo(p.x, p.y));
      ctx.stroke();
      data.events.forEach((event) => {
        const p = points.find((point) => Math.abs(point.t - Number(event.time_seconds || 0)) < 0.04);
        if (!p) return;
        ctx.fillStyle = event.event === 'tracking_lost' ? '#ff5d5d' : '#ffca3a';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
      if (highlightTime >= 0) {
        const current = points.reduce((best, p) => Math.abs(p.t - highlightTime) < Math.abs(best.t - highlightTime) ? p : best, points[0]);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(current.x, current.y, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    arenaImg.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);
    video.addEventListener('timeupdate', () => drawTrajectory(video.currentTime));
    resizeCanvas();
  </script>
